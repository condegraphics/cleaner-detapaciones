name: Sync Hostinger deployment branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Hostinger deployment branch
        run: git push origin "${GITHUB_SHA}:refs/heads/claude/laughing-hamilton-t61wvv"
